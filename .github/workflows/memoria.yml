name: Guardar uso de memoria
on:
  push
  
jobs:
  memoria:
    runs-on: ubunto-latest
  
    steps:
      - name: Descarga repositorio
        uses: actions/checkout@v4
        
      - name: Crear archivo con la memoria
        run: |
          mkdir -p memoria_j1
          free -h > memoria_j1/memoria.txt
          
      - name: Guardar archivo para descarga
        uses: actions/upload-artifact@v4
        with:
          name: memoria_j1
          path: memoria_j1/memoria.txt